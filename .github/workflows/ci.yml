name: ci
on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      # Warden and CNS are pinned to full commits in pyproject.toml; see "Bumping the Warden pin" in README.md.
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy
      - run: pytest -q
      # Burnish is held to what it holds others to.
      - run: burnish check .
      - run: burnish critic .
      - run: burnish readme-critic . --tier over-the-top

  rust:
    # Cargo.lock is committed and --locked fails the job if it is out of date, so the build is reproducible.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: exemplars/rust
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked

  cpp23:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - run: sudo apt-get update && sudo apt-get install -y g++-13 cmake
      - run: cmake -S exemplars/cpp23 -B build -DCMAKE_CXX_COMPILER=g++-13
      - run: cmake --build build
      - run: ctest --test-dir build --output-on-failure
