name: ci
on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      # Warden and CNS are pinned to full commits in pyproject.toml; see "Bumping the Warden pin" in README.md.
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy
      - run: pytest -q
      # Burnish is held to what it holds others to.
      - run: burnish check .
      - run: burnish critic .
      - run: burnish readme-critic . --tier over-the-top

  rust:
    # Cargo.lock is committed and --locked fails the job if it is out of date, so the build is reproducible. The Rust release
    # is pinned by exemplars/rust/rust-toolchain.toml and the runner image by name, so a new stable release or a new
    # ubuntu-latest cannot turn this job red by itself; see "Bumping the toolchain pins" in README.md.
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: exemplars/rust
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      # rustup 1.28 and later does not fetch the toolchain a rust-toolchain.toml names on its own, so install it here.
      - run: rustup toolchain install
      - name: The toolchain is the release rust-toolchain.toml names
        run: |
          expected=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)
          rustc --version
          cargo --version
          cargo clippy --version
          test -n "$expected"
          test "$(rustc --version | cut -d' ' -f2)" = "$expected"
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked

  cpp23:
    # The runner image is named, not ubuntu-latest, and the step after the install prints and asserts the g++ major version
    # and the cmake major version, so a different compiler or cmake fails here, loudly, instead of changing the warnings.
    # Exact apt version pins are not used: they are removed from the archive and then break the install.
    # To move to another compiler or cmake, see "Bumping the toolchain pins" in README.md.
    runs-on: ubuntu-24.04
    env:
      GXX_MAJOR: "13"
      CMAKE_MAJOR: "3"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - run: sudo apt-get update && sudo apt-get install -y "g++-${GXX_MAJOR}" cmake
      - name: The compiler and cmake are the versions this job is written for
        run: |
          "g++-${GXX_MAJOR}" --version | head -n 1
          cmake --version | head -n 1
          test "$("g++-${GXX_MAJOR}" -dumpversion | cut -d. -f1)" = "${GXX_MAJOR}"
          test "$(cmake --version | sed -n '1s/^cmake version \([0-9]*\).*/\1/p')" = "${CMAKE_MAJOR}"
      - run: cmake -S exemplars/cpp23 -B build -DCMAKE_CXX_COMPILER="g++-${GXX_MAJOR}"
      - run: cmake --build build
      - run: ctest --test-dir build --output-on-failure
