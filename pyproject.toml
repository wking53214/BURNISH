[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "streamline"
version = "0.2.0"
description = "What makes code beautiful, written down, checked, and applied to itself"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "William N. King" }]
keywords = ["code-quality", "readme", "style", "python", "rust", "cpp23"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Documentation",
]
dependencies = ["elegant @ git+https://github.com/wking53214/Elegant.git@main"]

[project.urls]
Homepage = "https://github.com/wking53214/Streamline"

[project.scripts]
streamline = "streamline.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["streamline"]

[tool.pytest.ini_options]
testpaths = ["tests", "exemplars/python"]
pythonpath = ["exemplars/python"]
