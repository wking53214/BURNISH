[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "burnish"
version = "0.3.17"
description = "What makes code beautiful, written down, checked, and applied to itself"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "William N. King" }]
keywords = ["code-quality", "readme", "style", "python", "rust", "cpp23"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Documentation",
]
# Warden is pinned to a full commit, never to a branch or a movable tag, so a change on its main cannot silently break
# this seat; the release the commit corresponds to is in the comment on its line. CNS is pinned by its release tag, the
# one spelling every repository in the circuit uses, because pip treats a tag URL and a commit URL as different sources.
# To bump: see "Bumping the Warden pin" in README.md.
dependencies = [
    "warden @ git+https://github.com/wking53214/Warden.git@df212db32c230a00cf4100038637be873262a816",  # Warden 0.16.2, not tagged
    "cns @ git+https://github.com/wking53214/CNS.git@v2.2.0",  # v2.2.0 = ce6bd05578a7a3e3cafa0cfa1e9a2cca8a5f171f
]

[project.urls]
Homepage = "https://github.com/wking53214/Burnish"

[project.scripts]
burnish = "burnish.cli:run"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff~=0.17", "mypy~=2.4"]

[tool.setuptools]
packages = ["burnish"]

[tool.pytest.ini_options]
testpaths = ["tests", "exemplars/python"]
pythonpath = ["exemplars/python"]

[tool.ruff]
line-length = 140
target-version = "py311"
extend-exclude = ["exemplars/rust", "exemplars/cpp23", "build"]

[tool.ruff.lint]
select = ["E", "F", "W", "B"]

[tool.mypy]
python_version = "3.11"
files = ["burnish", "tests", "exemplars/python"]
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
check_untyped_defs = true
no_implicit_optional = true

# The shipped package is fully annotated; test code is checked but not required to annotate every function.
[[tool.mypy.overrides]]
module = "burnish.*"
disallow_untyped_defs = true

# Warden ships no py.typed marker, so mypy cannot read its types; this is the only missing-import exemption.
[[tool.mypy.overrides]]
module = ["warden", "warden.*"]
ignore_missing_imports = true
