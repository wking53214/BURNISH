[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "burnish"
version = "0.2.0"
description = "What makes code beautiful, written down, checked, and applied to itself"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "William N. King" }]
keywords = ["code-quality", "readme", "style", "python", "rust", "cpp23"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Documentation",
]
# Pinned to a full Warden commit (0.12.0), not a branch, so a change on Warden main cannot silently break this seat.
# To bump: see "Bumping the Warden pin" in README.md.
dependencies = ["warden @ git+https://github.com/wking53214/Warden.git@72e5745d6f9febc4753160bc248badcfb449bc3d",
                "cns @ git+https://github.com/wking53214/CNS.git@v1.9.0"]

[project.urls]
Homepage = "https://github.com/wking53214/Burnish"

[project.scripts]
burnish = "burnish.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["burnish"]

[tool.pytest.ini_options]
testpaths = ["tests", "exemplars/python"]
pythonpath = ["exemplars/python"]
