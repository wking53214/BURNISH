[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "burnish"
version = "0.5.11"
description = "What makes code beautiful, written down, checked, and applied to itself"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "William N. King" }]
keywords = ["code-quality", "readme", "style", "python", "rust", "cpp23"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Documentation",
]
# CNS is the one runtime dependency. It is pinned by its release tag, the one spelling every repository in the circuit
# uses, because pip treats a tag URL and a commit URL as different sources. Warden is needed only by the finisher
# (`burnish finish`), so it is the `finisher` extra; it is pinned to a full commit, never to a branch or a movable tag,
# with the release the commit corresponds to in the comment on its line. To bump: see "Bumping the Warden pin" in README.md.
dependencies = [
    "cns @ git+https://github.com/wking53214/CNS.git@v4.1.0",  # v4.1.0 = c84ef8c60079aae1753f92d9169d89081c670c22
]

[project.urls]
Homepage = "https://github.com/wking53214/Burnish"

[project.scripts]
burnish = "burnish.cli:run"

[project.optional-dependencies]
finisher = [
    "warden @ git+https://github.com/wking53214/Warden.git@26d8128ecd75c841125128533812763385dc7497",  # Warden 1.0.0
]
dev = ["burnish[finisher]", "pytest>=8", "ruff~=0.17", "mypy~=2.4"]

[tool.setuptools]
packages = ["burnish"]

[tool.pytest.ini_options]
testpaths = ["tests", "exemplars/python"]
pythonpath = ["exemplars/python"]

[tool.ruff]
line-length = 140
target-version = "py311"
extend-exclude = ["exemplars/rust", "exemplars/cpp23", "build"]

[tool.ruff.lint]
select = ["E", "F", "W", "B"]

[tool.mypy]
python_version = "3.11"
files = ["burnish", "tests", "exemplars/python"]
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
check_untyped_defs = true
no_implicit_optional = true

# The shipped package is fully annotated; test code is checked but not required to annotate every function.
[[tool.mypy.overrides]]
module = "burnish.*"
disallow_untyped_defs = true

# Warden ships no py.typed marker, so mypy cannot read its types; this is the only missing-import exemption.
[[tool.mypy.overrides]]
module = ["warden", "warden.*"]
ignore_missing_imports = true
